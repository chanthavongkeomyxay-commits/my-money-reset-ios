    /* ===================================================================
       v2.2 — Monochrome theme (black / white / zinc) + charts + PIN lock
       =================================================================== */
    :root {
      --fg:#09090b; --inv:#ffffff; --mut:#a1a1aa; --grid:#e4e4e7; --txt:#71717a;
      --s0:#09090b; --s1:#3f3f46; --s2:#71717a; --s3:#a1a1aa; --s4:#d4d4d8; --s5:#e4e4e7;
    }
    [data-theme="dark"] {
      --fg:#fafafa; --inv:#000000; --mut:#52525b; --grid:#27272a; --txt:#a1a1aa;
      --s0:#fafafa; --s1:#d4d4d8; --s2:#a1a1aa; --s3:#71717a; --s4:#52525b; --s5:#3f3f46;
    }

    /* ---- Light theme: pure neutral ---- */
    body { background:#fafafa; color:#09090b; }
    .card, .bento { background:#fff; border-color:#e4e4e7; box-shadow:none; }

    .btn-danger { background:transparent; color:#09090b; border:1px dashed #71717a; }
    .btn-danger:hover { background:#f4f4f5; }
    .input { border-color:#e4e4e7; background:#fff; color:#09090b; }
    .input:focus { border-color:#09090b; box-shadow:0 0 0 3px rgba(9,9,11,.10); }
    .label { color:#52525b; }
    .nav-item.active, .nav-item.active svg { color:#09090b; stroke:#09090b; }
    .nav-item.active { font-weight:700; }
    .chip { background:#f4f4f5; border-color:#e4e4e7; color:#52525b; }
    .sel-btn { background:#fafafa; border-color:#e4e4e7; }
    .sel-btn.on { background:#e4e4e7; border-color:#52525b; }
    .toast { background:#09090b; color:#fff; }

    .progress-fill.bg-danger-500 { background:repeating-linear-gradient(135deg,var(--fg) 0 5px,var(--inv) 5px 8px) !important; outline:1px solid var(--fg); outline-offset:-1px; }

    /* ---- Dark theme: kill leftover green ---- */
    [data-theme="dark"] body { background:#000; color:#fafafa; }
    [data-theme="dark"] .bg-primary-50 { background:#18181b !important; }
    [data-theme="dark"] .has-\[\:checked\]\:bg-primary-50:has(:checked) { background:#27272a !important; }

    /* ---- Segmented toggle ---- */
    .seg { display:inline-flex; padding:3px; border-radius:9999px; background:#f4f4f5; border:1px solid #e4e4e7; }
    .seg button { padding:.3rem .9rem; border-radius:9999px; font-size:.75rem; font-weight:600; color:#71717a; transition:all .15s; }
    .seg button.on { background:#09090b; color:#fff; }
    [data-theme="dark"] .seg { background:#18181b; border-color:#27272a; }
    [data-theme="dark"] .seg button.on { background:#fafafa; color:#000; }

    /* ---- Charts ---- */
    .c-tx { fill:var(--txt); font-size:10px; font-family:inherit; }
    .c-inc { fill:var(--fg); }
    .c-exp { fill:var(--mut); }
    .sw { display:inline-block; width:10px; height:10px; border-radius:3px; }
    .sw-inc { background:var(--fg); }
    .sw-exp { background:var(--mut); }
    .c-bar { transform-box:fill-box; transform-origin:bottom; animation:barGrow .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes barGrow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
    .c-grp { cursor:pointer; transition:opacity .15s; }
    .c-grp.dim { opacity:.3; }
    .c-donut-seg { transition:stroke-width .15s; }
    .c-line { stroke-dasharray:1200; stroke-dashoffset:1200; animation:lineDraw 1s ease forwards; }
    @keyframes lineDraw { to { stroke-dashoffset:0; } }
    @media (prefers-reduced-motion: reduce) { .c-bar, .c-line { animation:none; stroke-dashoffset:0; } }
    .stripe-bar { background:repeating-linear-gradient(135deg,var(--fg) 0 5px,var(--inv) 5px 8px); outline:1px solid var(--fg); outline-offset:-1px; }

    /* ---- PIN pad / lock screen ---- */
    .pin-pad { position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem; background:#fafafa; color:#09090b; }
    [data-theme="dark"] .pin-pad { background:#000; color:#fafafa; }
    .pin-dots { display:flex; gap:.9rem; margin:1.25rem 0 .5rem; }
    .pin-dots span { width:14px; height:14px; border-radius:9999px; border:2px solid currentColor; transition:background .12s, transform .12s; }
    .pin-dots span.on { background:currentColor; transform:scale(1.1); }
    .pin-grid { display:grid; grid-template-columns:repeat(3,4.5rem); gap:.9rem; margin-top:1.5rem; }
    .pin-key { height:4.5rem; border-radius:9999px; border:1px solid var(--grid); font-size:1.5rem; font-weight:500; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; display:flex; align-items:center; justify-content:center; transition:transform .08s, background .12s; color:inherit; background:transparent; }
    .pin-key:active { transform:scale(.92); background:var(--grid); }
    .pin-key.ghost { border-color:transparent; font-size:1rem; }
    .pin-msg { min-height:1.25rem; font-size:.8rem; color:var(--txt); text-align:center; }
    .shake { animation:shake .35s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }

    /* ---- v2.4: top bar + drawer ---- */
    .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:.5rem; padding:calc(.5rem + env(safe-area-inset-top,0px)) .75rem .5rem; background:#fafafa; border-bottom:1px solid #e4e4e7; }
    [data-theme="dark"] .topbar { background:#000; border-color:#27272a; }
    @media (min-width:768px) { .topbar { display:none !important; } }
    .tb-btn { width:2.5rem; height:2.5rem; border-radius:.75rem; display:flex; align-items:center; justify-content:center; color:inherit; }
    .tb-btn:active { background:#e4e4e7; }
    [data-theme="dark"] .tb-btn:active { background:#27272a; }
    #drawer { position:fixed; inset:0; z-index:80; }
    .drawer-bk { position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; transition:opacity .25s; }
    #drawer.open .drawer-bk { opacity:1; }
    .drawer-panel { position:absolute; top:0; bottom:0; left:0; width:min(21rem,86vw); background:#fff; color:#09090b; transform:translateX(-100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:8px 0 30px rgba(0,0,0,.15); }
    [data-theme="dark"] .drawer-panel { background:#09090b; color:#fafafa; border-right:1px solid #27272a; }
    #drawer.open .drawer-panel { transform:translateX(0); }

    @media (prefers-reduced-motion: reduce) { .drawer-panel, .drawer-bk { transition:none; } }

function getRate(from, to) {
  if (from === to) return 1;
  const r = (state.settings.exchangeRates || []).find(x => x.from === from && x.to === to);
  if (r) return r.rate;

function getCurrentBudgetPeriod() {
  const now = new Date();
  const day = now.getDate();
  const payday = state.settings.payday || 28;
  let start, end;
  if (day >= payday) {
    start = new Date(now.getFullYear(), now.getMonth(), payday);
    end = new Date(now.getFullYear(), now.getMonth() + 1, payday - 1);
  } else {
    start = new Date(now.getFullYear(), now.getMonth() - 1, payday);
    end = new Date(now.getFullYear(), now.getMonth(), payday - 1);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

function initFirebase() {
  const cfg = HARDCODED_FB_CONFIG;
  if (!cfg || !cfg.apiKey || !cfg.projectId || cfg.apiKey.includes('PLACEHOLDER')) {
    firebaseReady = false;
    console.warn('Firebase config incomplete — put full apiKey/appId in HARDCODED_FB_CONFIG');
    return false;

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(cfg);
    }
    firebaseReady = true;

    firebase.auth().onAuthStateChanged(async (user) => {
      currentUser = user;
      if (user) {
        localStorage.removeItem(GUEST_KEY);
        try { await ensureUserProfile(user); }
        catch (profileError) { console.error('Profile bootstrap error', profileError); }
        await loadFromCloud();
        // แสดงหน้าสำเร็จเฉพาะเมื่อมาจากหน้า welcome/login
        if (currentPage === 'welcome' || currentPage === 'login') {

        }
      }
    });

  } catch (e) {
    console.error('Firebase init error', e);
    firebaseReady = false;
    showToast('เชื่อมต่อ Firebase ไม่สำเร็จ: ' + e.message);
    return false;
  }
}

async function save() {

      const payload = JSON.parse(JSON.stringify({

        lastUpdated: Date.now(),
        syncedAt: new Date().toISOString()
      }));
      await db.collection('users').doc(currentUser.uid).set(payload, { merge: true });

      console.error('Cloud save error', e);
      showToast('บันทึกขึ้นคลาวด์ไม่สำเร็จ (ข้อมูลในเครื่องยังอยู่)');
    } finally {
      syncing = false;
    }
  }
}

async function loadFromCloud() {
  if (!firebaseReady || !currentUser) return;
  try {
    syncing = true;
    showToast('กำลังดึงข้อมูลจากคลาวด์...');
    const db = firebase.firestore();
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if (doc.exists) {
      const cloud = doc.data();
      // Prefer newer data
      const cloudTime = cloud.lastUpdated || 0;
      const localTime = state.lastUpdated || 0;
      if (cloudTime >= localTime) {
        state = { ...state, ...cloud };
        saveLocal();
        showToast('ซิงค์ข้อมูลจากคลาวด์เรียบร้อย');
      } else {
        // Local is newer → push directly. save() skips writes while syncing=true.
        const payload = JSON.parse(JSON.stringify({
          ...state,
          lastUpdated: Date.now(),
          syncedAt: new Date().toISOString()
        }));
        await db.collection('users').doc(currentUser.uid).set(payload, { merge: true });
        showToast('อัปโหลดข้อมูลจากเครื่องขึ้นคลาวด์แล้ว');
      }
    } else {
      // First time → upload local directly; save() is intentionally not used
      // here because syncing is already true in this function.
      const payload = JSON.parse(JSON.stringify({
        ...state,
        lastUpdated: Date.now(),
        syncedAt: new Date().toISOString()
      }));
      await db.collection('users').doc(currentUser.uid).set(payload, { merge: true });
      showToast('สร้างข้อมูลบนคลาวด์จากเครื่องนี้แล้ว');
    }
    render();
  } catch (e) {
    console.error('Cloud load error', e);
    showToast('ดึงข้อมูลจากคลาวด์ไม่สำเร็จ');
  } finally {
    syncing = false;
  }
}

async function ensureUserProfile(user) {
  if (!firebaseReady || !user) return null;
  const ref = firebase.firestore().collection('users').doc(user.uid).collection('profile').doc('main');
  const snap = await ref.get();
  if (!snap.exists) {
    await ref.set({
      uid: user.uid,
      displayName: user.displayName || '',
      email: user.email || '',
      photoURL: user.photoURL || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } else {
    const data = snap.data() || {};
    const patch = {};
    if (!data.email && user.email) patch.email = user.email;
    if (!data.displayName && user.displayName) patch.displayName = user.displayName;
    if (Object.keys(patch).length) {
      patch.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      await ref.set(patch, { merge: true });
    }
  }
  return (await ref.get()).data() || {};
}

    await ref.set({
      uid: currentUser.uid,
      displayName: name,
      email: currentUser.email || '',
      photoURL: currentUser.photoURL || '',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

      'auth/account-exists-with-different-credential': 'อีเมลนี้มีบัญชีที่ใช้วิธีเข้าสู่ระบบอื่นอยู่แล้ว'

// ---------- UI Helpers ----------
function showToast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hide');
  setTimeout(() => el.classList.add('hide'), duration);
}
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-root').classList.remove('hide');
}
function closeModal() { document.getElementById('modal-root').classList.add('hide'); }

function getBalancesByCurrency() {
  const r = { THB: 0, LAK: 0 };
  state.accounts.forEach(a => { r[a.currency] = (r[a.currency] || 0) + a.balance; });
  return r;
}
function getTransactionsInPeriod(start, end, type) {
  return state.transactions.filter(t => {
    if (t.date < start || t.date > end) return false;
    if (type && t.type !== type) return false;
    if (t.type === 'transfer') return false;
    return true;
  });
}
function getMonthlyByType(start, end, type) {
  const byCur = { THB: 0, LAK: 0 };
  getTransactionsInPeriod(start, end, type).forEach(t => { byCur[t.currency] = (byCur[t.currency] || 0) + t.amount; });
  return byCur;
}
function getCategorySpentByCurrency(catId, start, end) {
  const r = { THB: 0, LAK: 0 };
  state.transactions.filter(t => t.type === 'expense' && t.category === catId && t.date >= start && t.date <= end)
    .forEach(t => { r[t.currency] = (r[t.currency] || 0) + t.amount; });
  return r;
}
function calcStreak() {
  const dates = [...new Set(state.transactions.map(t => t.date))].sort().reverse();
  if (!dates.length) return 0;
  let streak = 0, expected = todayStr();
  for (const d of dates) {
    if (d === expected) {
      streak++;
      const p = new Date(expected); p.setDate(p.getDate() - 1);
      expected = p.toISOString().slice(0,10);
    } else break;
  }
  return streak;
}

// ---------- Navigation ----------
function navigate(page) {
  // อนุญาต guest: เข้าแอปได้โดยไม่ล็อกอิน, แต่ยังแนะนำล็อกอิน
  const publicPages = ['welcome', 'login'];
  if (page === 'subscription' && !currentUser) { showToast('กรุณาเข้าสู่ระบบก่อนจัดการ Subscription'); page = 'login'; }
  if (!currentUser && !isGuest() && !publicPages.includes(page)) {
    page = 'welcome';
  }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const bottomNav = document.querySelector('.bottom-nav');
  const sidebar = document.querySelector('.sidebar');
  const showChrome = !!(currentUser || isGuest()) && !publicPages.includes(page);
  const tbar = document.getElementById('topbar'); if (tbar) tbar.style.display = showChrome ? '' : 'none';
  if (bottomNav) bottomNav.style.display = showChrome ? '' : 'none';
  if (sidebar) {
    // sidebar แสดงบน desktop เท่านั้นผ่าน CSS; แค่ไม่บังคับซ่อนเมื่อ guest
    if (!showChrome) sidebar.style.display = 'none';
    else sidebar.style.display = '';
  }
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById('app');
  const pages = {
    welcome: renderWelcome,
    loginSuccess: renderLoginSuccess,
    subscription: renderSubscription,
    dashboard: renderDashboard,
    transactions: renderTransactions,
    add: () => renderAddForm(),
    budget: renderBudget,
    goals: renderGoals,
    insights: renderInsights,
    commitment: renderCommitment,
    reports: renderReports,
    analytics: renderAnalytics,
    fx: renderFx,
    settings: renderSettings,
    login: renderLogin
  };
  if (window._lastRenderLang !== getLang()) { window._lastRenderLang = getLang(); try { refreshAccountNames(); } catch (e) {} }
  app.innerHTML = (pages[currentPage] || renderWelcome)();
  bindEvents();
  updateTopbar();
  if (currentPage === 'fx') { updateFxView(); if (!fxMeta.rates || fxMeta.base !== fxState.from) fxRefresh(false); }
  if (currentPage === 'add') {
    try { showSplitToggleForExpense(); } catch(e) {}
    try { initAutoCategory(); } catch(e) { console.error(e); }
  }
}

function renderBudgetBar(label, spent, budget, currency) {
  const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
  let color = 'bg-primary-500';
  if (pct >= 100) color = 'bg-danger-500';
  else if (pct >= 90) color = 'bg-warn-500';
  else if (pct >= 70) color = 'bg-amber-400';
  return `<div>
    <div class="flex justify-between text-sm mb-1"><span class="font-medium">${label}</span>
    <span class="text-slate-500">${formatCurrency(spent, currency)} / ${formatCurrency(budget, currency)} (${pct.toFixed(0)}%)</span></div>
    <div class="progress-bar"><div class="progress-fill ${color}" style="width:${pct}%"></div></div>
  </div>`;
}

function generateInsights(period, foodSpent, balances) {
  const msgs = [];
  const lang = getLang();
  const foodBudget = state.settings.foodDailyLAK * 30;
  const foodPct = foodBudget > 0 ? ((foodSpent.LAK || 0) / foodBudget * 100).toFixed(0) : 0;
  if (foodBudget > 0) {
    msgs.push(lang==='en' ? `Food spending is ${foodPct}% of budget this month`
      : lang==='zh' ? `本月餐饮已使用预算的 ${foodPct}%`
      : lang==='lo' ? `ເດືອນນີ້ໃຊ້ຄ່າອາຫານ ${foodPct}% ຂອງງົບ`
      : `เดือนนี้คุณใช้ค่าอาหารไปแล้ว ${foodPct}% ของงบ`);
  }
  if (balances.LAK < state.settings.rentLAK) {
    msgs.push(lang==='en' ? 'Reserve may not cover next rent — review non-essential spending'
      : lang==='zh' ? '储备可能不够下期房租 — 请检查非必要支出'
      : lang==='lo' ? 'ເງິນສຳຮອງອາດບໍ່ພໍຄ່າເຊົ່າຮອບຕໍ່ໄປ'
      : 'เงินสำรองยังไม่เพียงพอสำหรับค่าเช่ารอบถัดไป — ลองทบทวนรายจ่ายที่ไม่จำเป็น');
  }
  msgs.push(lang==='en' ? `Daily food+transport budget ~ ${formatCurrency(state.settings.foodDailyLAK + state.settings.transportDailyLAK, 'LAK')}`
    : lang==='zh' ? `每日餐饮+交通预算约 ${formatCurrency(state.settings.foodDailyLAK + state.settings.transportDailyLAK, 'LAK')}`
    : lang==='lo' ? `ງົບອາຫານ+ເດີນທາງຕໍ່ມື້ປະມານ ${formatCurrency(state.settings.foodDailyLAK + state.settings.transportDailyLAK, 'LAK')}`
    : `งบอาหาร+เดินทางต่อวันประมาณ ${formatCurrency(state.settings.foodDailyLAK + state.settings.transportDailyLAK, 'LAK')}`);
  const streak = calcStreak();
  if (streak > 0) {
    msgs.push(lang==='en' ? `Logged expenses ${streak} days in a row — great!`
      : lang==='zh' ? `已连续记录支出 ${streak} 天，很棒！`
      : lang==='lo' ? `ບັນທຶກລາຍຈ່າຍຕໍ່ເນື່ອງ ${streak} ມື້ — ເກັ່ງຫຼາຍ!`
      : `คุณบันทึกรายจ่ายต่อเนื่องครบ ${streak} วันแล้ว เก่งมาก!`);
  }
  if (!msgs.length) {
    msgs.push(lang==='en' ? 'Not enough data yet — try adding a transaction'
      : lang==='zh' ? '数据不足 — 请先添加一笔记录'
      : lang==='lo' ? 'ຍັງບໍ່ມີຂໍ້ມູນພຽງພໍ — ລອງເພີ່ມລາຍການ'
      : 'ยังไม่มีข้อมูลเพียงพอสำหรับสรุป — ลองเพิ่มรายการดูนะ');
  }
  return msgs;
}

function renderTxItem(t) {
  const cat = t.type === 'income' ? INCOME_CATEGORIES.find(c => c.id === t.category) : EXPENSE_CATEGORIES.find(c => c.id === t.category);
  const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '-' : '↔';
  const color = t.type === 'income' ? 'amount-income' : t.type === 'expense' ? 'amount-expense' : 'amount-transfer';
  // Wallet source display
  let walletLine = '';
  if (t.splits && t.splits.length > 1) {
    walletLine = t.splits.map(s => {
      const acc = state.accounts.find(a => a.id === s.accountId);
      return (acc ? acc.name : s.accountName || s.accountId) + ' ' + formatCurrency(s.amount, s.currency || t.currency);
    }).join(' + ');
  } else {
    const acc = state.accounts.find(a => a.id === t.accountId);
    walletLine = acc ? acc.name : (t.accountName || '—');
  }
  const walletBadge = `<div class="text-xs mt-0.5"><span class="wallet-badge">👛 ${walletLine}</span></div>`;
  return `<div class="card p-3 flex items-center gap-3" data-id="${t.id}">
    <div class="text-2xl">${cat?.icon || '📝'}</div>
    <div class="flex-1 min-w-0">
      <div class="font-medium text-sm truncate">${cat ? catName(cat.id, cat.name) : t.category}${t.note ? ' · ' + t.note : ''}</div>
      <div class="text-xs text-slate-400">${t.date}${t.createdAt ? ' · ' + new Date(t.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</div>
      ${walletBadge}
    </div>
    <div class="text-right">
      <div class="font-semibold ${color}">${sign}${formatCurrency(t.amount, t.currency)}</div>
      <div class="flex gap-1 mt-1 justify-end">
        <button onclick="editTx('${t.id}')" class="text-xs text-slate-400 hover:text-primary-600">แก้ไข</button>
        <button onclick="confirmDeleteTx('${t.id}')" class="text-xs text-slate-400 hover:text-danger-600">ลบ</button>
      </div>
    </div>
  </div>`;
}

function renderTransactions() {
  const sorted = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0) - (a.createdAt||0));
  const walletOpts = state.accounts.map(a =>
    `<option value="${a.id}">${a.name} (${a.currency})</option>`
  ).join('');
  return `<div class="space-y-4">
    <div class="flex items-center justify-between"><h1 class="text-xl font-bold">${t('all_transactions')}</h1>
    <button onclick="navigate('add')" class="btn btn-primary text-sm">+ ${t('add')}</button></div>
    <div class="flex gap-2 overflow-x-auto pb-1 flex-wrap">
      <input type="search" id="tx-search" placeholder="${t('search')}" class="input flex-1 min-w-[120px]" oninput="filterTx()" />
      <select id="tx-filter-type" class="input w-auto" onchange="filterTx()">
        <option value="">${t('all_types')}</option>
        <option value="income">${t('type_income')}</option>
        <option value="expense">${t('type_expense')}</option>
        <option value="transfer">${t('type_transfer')}</option>
      </select>
      <select id="tx-filter-wallet" class="input w-auto min-w-[140px]" onchange="filterTx()">
        <option value="">${t('wallets') || 'ทุกกระเป๋า'} — ทั้งหมด</option>
        ${walletOpts}
      </select>
    </div>
    <div id="tx-list" class="space-y-2">
      ${sorted.length === 0 ? `<div class="text-center text-slate-400 py-12">${t('no_tx')}</div>` : sorted.map(tx => renderTxItem(tx)).join('')}
    </div>
  </div>`;
}

function filterTx() {
  const q = (document.getElementById('tx-search')?.value || '').toLowerCase();
  const type = document.getElementById('tx-filter-type')?.value || '';
  const walletId = document.getElementById('tx-filter-wallet')?.value || '';
  const list = document.getElementById('tx-list');
  if (!list) return;
  const sorted = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0) - (a.createdAt||0));
  const filtered = sorted.filter(t => {
    if (type && t.type !== type) return false;
    if (walletId) {
      const matchesMain = t.accountId === walletId;
      const matchesSplit = t.splits && t.splits.some(s => s.accountId === walletId);
      const matchesTo = t.toAccountId === walletId;
      if (!matchesMain && !matchesSplit && !matchesTo) return false;
    }
    if (q) {
      const cat = (t.type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).find(c => c.id === t.category);
      const acc = state.accounts.find(a => a.id === t.accountId);
      const hay = `${cat?.name||''} ${catName(t.category, t.category)} ${t.note||''} ${t.amount} ${acc?.name||''} ${t.accountName||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  list.innerHTML = filtered.length === 0
    ? '<div class="text-center text-slate-400 py-8">ไม่พบรายการ</div>'
    : filtered.map(renderTxItem).join('');
}

function toggleCatSelect() {
  const type = document.querySelector('input[name="type"]:checked')?.value;
  const catSelect = document.getElementById('category-select');
  const transferTo = document.getElementById('transfer-to');
  if (type === 'transfer') {
    document.getElementById('cat-select').classList.add('hide');
    transferTo.classList.remove('hide');
  } else {
    document.getElementById('cat-select').classList.remove('hide');
    transferTo.classList.add('hide');
    const cats = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    catSelect.innerHTML = cats.map(c => `<option value="${c.id}">${c.icon} ${catName(c.id, c.name)}</option>`).join('');
  }
  showSplitToggleForExpense();
}
function onTxCurrencyChange() {
  const cur = document.getElementById('tx-currency')?.value || state.settings.primaryCurrency;
  ensureAccountsForCurrency(cur);
  const sel = document.getElementById('account-select');
  if (sel) {
    const lastId = localStorage.getItem('mmr_last_wallet') || '';
    sel.innerHTML = accountsForCurrency(cur).map(a => {
      const selAttr = a.id === lastId ? 'selected' : '';
      return `<option value="${a.id}" ${selAttr}>${a.name} — ${formatCurrency(a.balance, a.currency)}</option>`;
    }).join('');
  }
  if (document.getElementById('enable-split')?.checked) buildSplitRows();
}

function applyTxToBalance(tx, reverse) {
  const mul = reverse ? -1 : 1;
  if (tx.type === 'income') {
    const acc = state.accounts.find(a => a.id === tx.accountId);
    if (acc) acc.balance += tx.amount * mul;
  } else if (tx.type === 'expense') {
    // Multi-wallet split expense
    if (tx.splits && tx.splits.length > 0) {
      tx.splits.forEach(s => {
        const acc = state.accounts.find(a => a.id === s.accountId);
        if (acc) acc.balance -= (s.amount || 0) * mul;
      });
    } else {
      const acc = state.accounts.find(a => a.id === tx.accountId);
      if (acc) acc.balance -= tx.amount * mul;
    }
  } else if (tx.type === 'transfer') {
    const from = state.accounts.find(a => a.id === tx.accountId);
    const to = state.accounts.find(a => a.id === tx.toAccountId);
    if (from) from.balance -= tx.amount * mul;
    if (to) {
      if (from && from.currency === to.currency) to.balance += tx.amount * mul;
      else {
        const rate = getRate(from?.currency, to.currency);
        to.balance += (rate ? tx.amount * rate : tx.amount) * mul;
      }
    }
  }
}


function checkBudgetAlerts(category, amount, currency) {
  const period = getCurrentBudgetPeriod();
  const spent = getCategorySpentByCurrency(category, period.start, period.end);
  const spentAmt = spent[currency] || spent.LAK || 0;
  let budgetAmt = 0;
  if (state.budgets[category]?.amount) budgetAmt = state.budgets[category].amount;
  else if (category === 'food') budgetAmt = state.settings.foodDailyLAK * 30;
  else if (category === 'transport') budgetAmt = state.settings.transportDailyLAK * 30;
  else if (category === 'rent') budgetAmt = state.settings.rentLAK;
  if (budgetAmt <= 0) return;
  // Convert if needed (simple: only alert for LAK budgets)
  const totalSpent = spentAmt; // transaction already saved, don't add again
  const pct = (totalSpent / budgetAmt) * 100;
  if (pct >= 100 + (amount / budgetAmt * 100) * 0.5) {
    // over
    setTimeout(() => showToast(t('alert_over'), 4000), 600);
  } else if (pct >= 100) {
    setTimeout(() => showToast(t('alert_100'), 3500), 600);
  } else if (pct >= 85) {
    setTimeout(() => showToast(t('alert_85'), 3000), 600);
  } else if (pct >= 70) {
    setTimeout(() => showToast(t('alert_70'), 3000), 600);
  }
}


function toggleSplitMode() {
  const on = document.getElementById('enable-split')?.checked;
  const splitSec = document.getElementById('split-section');
  const singleSec = document.getElementById('single-wallet-section');
  if (!splitSec) return;
  if (on) {
    splitSec.classList.remove('hide');
    buildSplitRows();
  } else {
    splitSec.classList.add('hide');
  }
}

function buildSplitRows() {
  const cur = document.getElementById('tx-currency')?.value || state.settings.primaryCurrency || 'LAK';
  ensureAccountsForCurrency(cur);
  const accounts = accountsForCurrency(cur);
  const container = document.getElementById('split-rows');
  if (!container) return;
  container.innerHTML = accounts.map(a => `
    <div class="flex items-center gap-2">
      <span class="text-sm flex-1 truncate">${a.name}</span>
      <span class="text-xs text-slate-400 w-20 text-right">${formatCurrency(a.balance, a.currency)}</span>
      <input type="number" min="0" step="any" data-acc="${a.id}" data-cur="${a.currency}"
        class="input w-28 split-amount" placeholder="0" oninput="updateSplitTotal()" />
    </div>
  `).join('');
  updateSplitTotal();
}

function updateSplitTotal() {
  const amount = parseFloat(document.querySelector('[name="amount"]')?.value) || 0;
  let sum = 0;
  document.querySelectorAll('.split-amount').forEach(inp => {
    sum += parseFloat(inp.value) || 0;
  });
  const totalEl = document.getElementById('split-total');
  const remainEl = document.getElementById('split-remain');
  if (totalEl) totalEl.textContent = formatNumber(sum);
  if (remainEl) {
    const remain = amount - sum;
    remainEl.textContent = (remain >= 0 ? 'เหลือ: ' : 'เกิน: ') + formatNumber(Math.abs(remain));
    remainEl.className = remain < -0.001 ? 'text-danger-600 font-medium' : remain > 0.001 ? 'text-slate-500' : 'text-primary-600 font-medium';
  }
}

function getSplitData() {
  const splits = [];
  document.querySelectorAll('.split-amount').forEach(inp => {
    const amt = parseFloat(inp.value) || 0;
    if (amt > 0) {
      splits.push({
        accountId: inp.dataset.acc,
        amount: amt,
        currency: inp.dataset.cur
      });
    }
  });
  return splits;
}

function showSplitToggleForExpense() {
  const type = document.querySelector('input[name="type"]:checked')?.value;
  const wrap = document.getElementById('split-toggle-wrap');
  if (!wrap) return;
  if (type === 'expense') {
    wrap.classList.remove('hide');
  } else {
    wrap.classList.add('hide');
    const cb = document.getElementById('enable-split');
    if (cb) cb.checked = false;
    const splitSec = document.getElementById('split-section');
    if (splitSec) splitSec.classList.add('hide');
  }
}

function submitTx(e, editId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const type = fd.get('type');
  const amount = parseFloat(fd.get('amount'));
  const currency = fd.get('currency');
  const category = fd.get('category') || 'other';
  const date = fd.get('date');
  const accountId = fd.get('accountId');
  const toAccountId = fd.get('toAccountId');
  const note = fd.get('note') || '';
  if (amount <= 0) { showToast('จำนวนเงินต้องมากกว่า 0'); return; }

  // When editing, reverse the old impact first so validation sees the true available balance; restore on failure
  const snap = editId ? JSON.stringify(state.accounts) : null;
  const oldTx = editId ? state.transactions.find(x => x.id === editId) : null;
  if (oldTx) applyTxToBalance(oldTx, true);
  const fail = (m) => { if (snap) state.accounts = JSON.parse(snap); showToast(m); };

  const useSplit = type === 'expense' && document.getElementById('enable-split')?.checked;
  let splits = null;
  let primaryAccountId = accountId;
  let primaryAccountName = '';

  if (useSplit) {
    splits = getSplitData();
    if (!splits.length) { fail('กรุณาระบุจำนวนเงินอย่างน้อย 1 กระเป๋า'); return; }
    const splitSum = splits.reduce((s, x) => s + x.amount, 0);
    if (Math.abs(splitSum - amount) > 0.01) {
      fail(t('cannot_over') + ' (รวมต้องเท่ากับ ' + formatNumber(amount) + ')');
      return;
    }
    // Validate each wallet has enough balance
    for (const s of splits) {
      const acc = state.accounts.find(a => a.id === s.accountId);
      if (!acc) { fail('ไม่พบกระเป๋า'); return; }
      // When editing, balance was already reversed, so check current
      if (acc.balance < s.amount - 0.001) {
        fail(t('insufficient') + ': ' + acc.name);
        return;
      }
    }
    primaryAccountId = splits[0].accountId;
    const mainAcc = state.accounts.find(a => a.id === primaryAccountId);
    primaryAccountName = mainAcc ? mainAcc.name : '';
  } else {
    const acc = state.accounts.find(a => a.id === accountId);
    if (!acc) { fail('กรุณาเลือกกระเป๋าเงิน'); return; }
    if (type === 'expense' && acc.balance < amount - 0.001) {
      fail(t('insufficient') + ': ' + acc.name);
      return;
    }
    if (type === 'transfer') {
      const to = state.accounts.find(a => a.id === toAccountId);
      if (!to || to.id === acc.id) { fail('เลือกกระเป๋าต้นทางและปลายทางให้ต่างกัน'); return; }
      if (acc.balance < amount - 0.001) { fail(t('insufficient') + ': ' + acc.name); return; }
      if (acc.currency !== to.currency && !getRate(acc.currency, to.currency)) { fail('ไม่มีอัตราแลกเปลี่ยน ' + acc.currency + ' → ' + to.currency); return; }
    }
    primaryAccountName = acc.name;
    // Remember last used wallet
    localStorage.setItem('mmr_last_wallet', accountId);
  }

  if (editId) {
    const old = state.transactions.find(t => t.id === editId);
    state.transactions = state.transactions.filter(t => t.id !== editId);
  }

  const tx = {
    id: editId || uid(),
    type,
    amount,
    currency,
    category: type === 'transfer' ? 'transfer' : category,
    date,
    accountId: primaryAccountId,
    accountName: primaryAccountName,
    toAccountId: type === 'transfer' ? toAccountId : null,
    note,
    createdAt: Date.now(),
    splits: splits || undefined
  };

  applyTxToBalance(tx, false);
  state.transactions.push(tx);
  save();
  showToast(editId ? 'แก้ไขรายการแล้ว' : 'บันทึกรายการแล้ว');
  if (type === 'expense' && !editId) checkBudgetAlerts(category, amount, currency);
  navigate(editId ? 'transactions' : 'dashboard');
}

function confirmDeleteTx(id) {
  openModal(`<div class="p-6 space-y-4"><h2 class="text-lg font-bold">ยืนยันการลบ</h2>
    <p class="text-sm text-slate-600">คุณต้องการลบรายการนี้ใช่ไหม?</p>
    <div class="flex gap-2"><button onclick="deleteTx('${id}')" class="btn btn-danger flex-1">ลบรายการ</button>
    <button onclick="closeModal()" class="btn btn-secondary flex-1">ยกเลิก</button></div></div>`);
}
function deleteTx(id) {
  const tx = state.transactions.find(t => t.id === id);
  if (tx) { applyTxToBalance(tx, true); state.transactions = state.transactions.filter(t => t.id !== id); save(); showToast('ลบรายการแล้ว'); }
  closeModal(); render();
}
function editTx(id) {
  currentPage = 'add';
  document.getElementById('app').innerHTML = renderAddForm(id);
  bindEvents();
  toggleCatSelect();
  showSplitToggleForExpense();
  // If original had splits, enable split mode and fill
  const tx = state.transactions.find(t => t.id === id);
  if (tx && tx.splits && tx.splits.length > 1) {
    const cb = document.getElementById('enable-split');
    if (cb) { cb.checked = true; toggleSplitMode(); }
    setTimeout(() => {
      tx.splits.forEach(s => {
        const inp = document.querySelector(`.split-amount[data-acc="${s.accountId}"]`);
        if (inp) inp.value = s.amount;
      });
      updateSplitTotal();
    }, 50);
  }
}

  const period = getCurrentBudgetPeriod();
  return `<div class="space-y-4"><h1 class="text-xl font-bold">${t('budget')}</h1>
    <p class="text-sm text-slate-500">รอบงบ ${period.start} – ${period.end}</p>
    <div class="card p-4 space-y-4">
      ${EXPENSE_CATEGORIES.map(c => {
        const spent = getCategorySpentByCurrency(c.id, period.start, period.end);

        const pct = budgetLAK > 0 ? Math.min(100, (spent.LAK / budgetLAK)*100) : 0;

function doAddEmergency() {

function exportCSV() {
  const rows = [['id','type','amount','currency','category','date','account','note']];
  state.transactions.forEach(t => rows.push([t.id,t.type,t.amount,t.currency,t.category,t.date,t.accountName||'',t.note||'']));
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  downloadFile(csv, 'my-money-reset-transactions.csv', 'text/csv');
  showToast('ส่งออก CSV แล้ว');
}
function exportJSON() {
  downloadFile(JSON.stringify(state, null, 2), 'my-money-reset-backup.json', 'application/json');
  showToast('สำรองข้อมูลแล้ว');
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.transactions || !data.accounts) throw new Error('invalid');
      state = { ...state, ...data }; save(); showToast('นำเข้าข้อมูลสำเร็จ'); render();
    } catch { showToast('ไฟล์ไม่ถูกต้อง — ข้อมูลเดิมยังปลอดภัย'); }
  };
  reader.readAsText(file); e.target.value = '';
}
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function doLogin() {
  const email = document.getElementById('auth-email')?.value?.trim();
  const password = document.getElementById('auth-password')?.value;
  if (!email || !password) { showToast('กรอกอีเมลและรหัสผ่าน'); return; }
  loginEmail(email, password);
}
function doRegister() {
  const email = document.getElementById('auth-email')?.value?.trim();
  const password = document.getElementById('auth-password')?.value;
  if (!email || !password) { showToast('กรอกอีเมลและรหัสผ่าน'); return; }
  if (password.length < 6) { showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัว'); return; }
  const name = document.getElementById('auth-name')?.value?.trim() || '';
  registerEmail(email, password, name);
}

// ---------- Events & Init ----------
function bindEvents() {
  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.page);
    const page = btn.dataset.page;
    const labelMap = { dashboard: 'dashboard', transactions: 'transactions', budget: 'budget', goals: 'goals', settings: 'settings_title', reports: 'reports', insights: 'insights', commitment: 'commitment' };
    if (page === 'analytics' || page === 'fx') {
      const lab = page === 'fx' ? L('อัตราแลกเปลี่ยน', 'Exchange rates') : L('กราฟ', 'Charts');
      const sp = btn.querySelector('span');
      if (sp) sp.textContent = lab;
      else { const tn = [...btn.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim()); if (tn.length) tn[0].textContent = ' ' + lab; }
    }
    if (labelMap[page]) {
      const span = btn.querySelector('span');
      if (span) span.textContent = t(labelMap[page]);
      // sidebar text nodes after svg
      const texts = [...btn.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
      if (texts.length) texts[0].textContent = ' ' + t(labelMap[page]);
    }
  });
}

function L(th, en) { return getLang() === 'th' ? th : en; }

// ---------- helpers ----------
const CHART_RANGE_KEY = 'myMoneyReset_chartRange';

function primaryCur() { return state.settings.primaryCurrency || 'LAK'; }
function toPrimary(amount, cur) {
  const p = primaryCur();

  const r = getRate(cur, p);
  if (r) return amount * r;
  const a = getRate(cur, 'LAK'), b = getRate('LAK', p);

}

}
function monthLabel(dt) {

}

  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;

}

}
function sumRange(type, start, end) {
  let s = 0;

// ---------- data series ----------
function buildSeries(range) {
  const today = todayStr();
  const buckets = [];
  if (range === 'week') {
    for (let i = 6; i >= 0; i--) { const d = addDays(today, -i); buckets.push({ key: d, label: dayLabel(d), inc: 0, exp: 0 }); }
  } else {
    const [y, m] = today.split('-').map(Number);
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(Date.UTC(y, m - 1 - i, 1));
      buckets.push({ key: dt.toISOString().slice(0, 7), label: monthLabel(dt), inc: 0, exp: 0 });
    }
  }
  const idx = {};
  buckets.forEach((b, i) => { idx[b.key] = i; });
  state.transactions.forEach(tx => {
    if (tx.type !== 'income' && tx.type !== 'expense') return;
    const k = range === 'week' ? tx.date : (tx.date || '').slice(0, 7);
    const i = idx[k];
    if (i === undefined) return;
    const v = toPrimary(tx.amount, tx.currency);
    if (tx.type === 'income') buckets[i].inc += v; else buckets[i].exp += v;
  });
  return buckets;
}
function donutPeriod(range) {
  if (range === 'week') return { start: addDays(todayStr(), -6), end: todayStr() };
  return getCurrentBudgetPeriod();
}
function categoryTotals(start, end) {
  const map = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense' || tx.date < start || tx.date > end) return;
    map[tx.category || 'other'] = (map[tx.category || 'other'] || 0) + toPrimary(tx.amount, tx.currency);
  });
  return Object.entries(map).map(([id, value]) => {
    const c = EXPENSE_CATEGORIES.find(x => x.id === id) || { id, name: id, icon: '📦' };
    return { id, name: catName(c.id, c.name), icon: c.icon, value };
  }).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
}

function renderTrendChart() {

function suggestCategory(note, type, ignoreId) {
  const s = (note || '').toLowerCase().trim();
  if (s.length < 2 || (type !== 'expense' && type !== 'income')) return null;
  // 1) learn from history: same note typed before
  const counts = {};
  state.transactions.forEach(tx => {
    if (tx.id === ignoreId || tx.type !== type || !tx.note || !tx.category) return;
    if (type === 'expense' && tx.category === 'other') return;
    const n = tx.note.toLowerCase().trim();
    if (n === s) counts[tx.category] = (counts[tx.category] || 0) + 1;
  });
  const learned = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (learned) return { id: learned[0], source: 'history' };
  // 2) keyword match, longest keyword wins
  const dict = type === 'income' ? AUTO_KW_INCOME : AUTO_KW;
  let best = null, bestLen = 0;
  Object.entries(dict).forEach(([cat, kws]) => kws.forEach(k => {
    if (k.length > bestLen && s.indexOf(k.toLowerCase()) !== -1) { best = cat; bestLen = k.length; }
  }));
  return best ? { id: best, source: 'keyword' } : null;
}
function catLabel(id, type) {
  const list = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  const c = list.find(x => x.id === id); return c ? `${c.icon} ${catName(c.id, c.name)}` : id;
}
function initAutoCategory() {
  const form = document.getElementById('tx-form'); if (!form) return;
  const note = form.querySelector('input[name="note"]'), sel = document.getElementById('category-select');
  if (!note || !sel) return;
  const m = (form.getAttribute('onsubmit') || '').match(/submitTx\(event, '([^']*)'\)/);
  const editId = m ? m[1] : '';
  let touched = !!editId;
  sel.addEventListener('change', () => { touched = true; hint.textContent = ''; });
  const hint = document.createElement('p');
  hint.className = 'text-xs text-slate-500 mt-1';
  note.insertAdjacentElement('afterend', hint);
  const run = () => {
    if (touched) return;
    const type = (form.querySelector('input[name="type"]:checked') || {}).value;
    const sug = suggestCategory(note.value, type, editId);
    if (sug && [...sel.options].some(o => o.value === sug.id)) {
      sel.value = sug.id;
      hint.textContent = `✦ ${L('จัดหมวดอัตโนมัติ', 'Auto-categorized')}: ${catLabel(sug.id, type)}${sug.source === 'history' ? ' · ' + L('จากประวัติของคุณ', 'from your history') : ''}`;
    } else hint.textContent = '';
  };
  note.addEventListener('input', run);
  form.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener('change', () => setTimeout(run, 0)));
}
function autoRecategorize() {
  let n = 0;
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense' || tx.category !== 'other' || !tx.note) return;
    const s = suggestCategory(tx.note, 'expense', tx.id);
    if (s && s.id !== 'other') { tx.category = s.id; n++; }
  });
  save();
  showToast(n ? `${L('จัดหมวดใหม่แล้ว', 'Recategorized')} ${n} ${L('รายการ', 'items')}` : L('ไม่มีรายการที่เปลี่ยนได้', 'Nothing to change'));
  render();
}

const PIN_KEY = 'myMoneyReset_pin_v1';
const BIO_KEY = 'myMoneyReset_bio_v1';
const LOCKDELAY_KEY = 'myMoneyReset_lockDelay';
let padCfg = null, padBuf = '', padFails = 0, padBlockedUntil = 0, hiddenAt = 0;

function getPinData() { try { return JSON.parse(localStorage.getItem(PIN_KEY) || 'null'); } catch (e) { return null; } }
function hasPin() { return !!getPinData(); }
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
async function hashPin(pin, salt) {

    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return 'f' + cyrb53(s).toString(16);
}
async function storePin(pin) {

}
async function checkPin(pin) {

      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],

async function unlockWithBio() {

    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),

// ---------- Payday Planner (everything in the primary currency) ----------
function ppDefault(amount, cur) { return Math.round(toPrimary(amount, cur)); }
function openPaydayPlanner() {
  const P = primaryCur();

  const food = state.settings.foodDailyLAK || 0, trans = state.settings.transportDailyLAK || 0;
  const rows = [
    ['pp-rent', L('1. ค่าเช่าเดือนถัดไป', '1. Next month rent'), ppDefault(state.settings.rentLAK || 0, 'LAK')],
    ['pp-daily', L('2. อาหาร + เดินทาง', '2. Food + transport'), ppDefault((food + trans) * 30, 'LAK')],
    ['pp-bills', L('3. บิลจำเป็นอื่น', '3. Other essential bills'), 0],
    ['pp-ef', L('4. เงินสำรองฉุกเฉิน', '4. Emergency fund'), ppDefault(1000, 'THB')],
    ['pp-save', L('5. ออมตามเป้าหมาย', '5. Savings goal'), ppDefault(state.settings.savingsGoalMonthlyTHB || 0, 'THB')],
    ['pp-personal', L('6. ใช้จ่ายส่วนตัว', '6. Personal spending'), ppDefault(2000, 'THB')]
  ];
  openModal(`<div class="p-6 space-y-4"><h2 class="text-lg font-bold">${L('แบ่งเงินเดือน (Payday Planner)', 'Payday Planner')}</h2>
    <p class="text-sm text-slate-600">${L('รายได้ประมาณ', 'Estimated income')} <b class="mono">${formatCurrency(salary, P)}</b> · ${currencyName(P)} (${P}) — ${L('จัดสรรตามลำดับความสำคัญ (ไม่หักเงินจริงจนกว่าจะยืนยัน)', 'allocated by priority (no money moves until you confirm)')}</p>
    <div class="space-y-3 text-sm">
      ${rows.map(([id, label, v]) => `<div class="flex justify-between items-center gap-3"><span class="min-w-0">${label}</span><input type="number" inputmode="decimal" id="${id}" class="input text-right mono" style="width:9.5rem" value="${v}" /></div>`).join('')}
    </div>
    <div id="pp-total" class="text-sm font-medium text-center py-2"></div>
    <p class="text-[11px] text-slate-500 text-center">${L('เปลี่ยนรายได้และสกุลเงินหลักได้ที่หน้าตั้งค่า', 'Change income and primary currency in Settings')}</p>
    <div class="flex gap-2"><button onclick="confirmPayday()" class="btn btn-primary flex-1">${L('ยืนยันแผน', 'Confirm plan')}</button>
    <button onclick="closeModal()" class="btn btn-secondary flex-1">${L('ปิด', 'Close')}</button></div></div>`);
  setTimeout(() => {
    const ids = rows.map(r => r[0]);
    const update = () => {
      let sum = 0; ids.forEach(id => { sum += parseFloat(document.getElementById(id)?.value) || 0; });
      const el = document.getElementById('pp-total');
      const remain = salary - sum;
      if (el) el.innerHTML = remain >= 0
        ? `${L('จัดสรรทั้งหมด', 'Allocated')} ${formatCurrency(sum, P)} · ${L('เหลือ', 'Left')} ${formatCurrency(remain, P)}`
        : `<span class="font-bold">⚠ ${L('จัดสรรเกินรายรับ', 'Over income by')} ${formatCurrency(Math.abs(remain), P)}</span>`;
    };
    ids.forEach(id => document.getElementById(id)?.addEventListener('input', update)); update();
  }, 50);
}
function confirmPayday() {
  const P = primaryCur();
  const salary = incomeInPrimary();
  const g = id => parseFloat(document.getElementById(id)?.value) || 0;
  const plan = [
    [g('pp-rent'), 'spending', L('จัดสรร: ค่าเช่า', 'Plan: rent')],
    [g('pp-daily'), 'spending', L('จัดสรร: อาหาร+เดินทาง', 'Plan: food + transport')],
    [g('pp-bills'), 'spending', L('จัดสรร: บิลจำเป็น', 'Plan: essential bills')],
    [g('pp-ef'), 'emergency', L('จัดสรร: เงินสำรองฉุกเฉิน', 'Plan: emergency fund')],
    [g('pp-save'), 'saving', L('จัดสรร: ออม', 'Plan: savings')],
    [g('pp-personal'), 'spending', L('จัดสรร: ใช้จ่ายส่วนตัว', 'Plan: personal')]
  ];
  const total = plan.reduce((s, x) => s + x[0], 0);
  if (total > salary + 0.01) { showToast(t('cannot_over')); return; }
  ensureAccountsForCurrency(P);
  const bank = state.accounts.find(a => a.type === 'bank' && a.currency === P) || state.accounts.find(a => a.currency === P);
  if (!bank) { showToast('ไม่พบบัญชี ' + P); return; }
  const incomeTx = { id: uid(), type: 'income', amount: salary, currency: P, category: 'salary', date: todayStr(),
    accountId: bank.id, accountName: bank.name, note: L('เงินเดือน (จัดสรร)', 'Salary (planned)'), createdAt: Date.now() };
  applyTxToBalance(incomeTx, false);
  state.transactions.push(incomeTx);
  plan.forEach(([amt, type, note]) => {
    if (amt <= 0) return;
    let target = state.accounts.find(a => a.type === type && a.currency === P);
    if (!target) {
      target = { id: 'acc_' + type + '_' + P.toLowerCase() + '_' + Date.now().toString(36), name: accountLabel(type, P), currency: P, balance: 0, type };
      state.accounts.push(target);
    }
    if (target.id === bank.id) return;
    bank.balance -= amt; target.balance += amt;
    state.transactions.push({ id: uid(), type: 'transfer', amount: amt, currency: P, category: 'transfer', date: todayStr(),
      accountId: bank.id, accountName: bank.name, toAccountId: target.id, note, createdAt: Date.now() });
  });
  save(); closeModal(); showToast(t('allocation_success')); render();
}

// ---------- Exchange-rate calculator (separate page) ----------
const FX_CACHE_KEY = 'myMoneyReset_fxcache_v1';
const FX_EXTRA = ['JPY', 'KRW', 'SGD', 'GBP', 'MYR', 'AUD', 'HKD', 'INR', 'KHR', 'MMK'];
let fxState = null;
let fxMeta = { base: null, rates: null, updated: null, src: 'none' };
function fxCodes() { return [...new Set([...CURRENCIES.map(c => c.code), ...FX_EXTRA])]; }
function fxName(code) {
  const own = CURRENCIES.find(c => c.code === code);
  if (own) return currencyName(code);
  try { return new Intl.DisplayNames([LOCALES[getLang()] || 'en-US'], { type: 'currency' }).of(code) || code; } catch (e) { return code; }
}
function fxInit() {
  if (fxState) return;
  const p = primaryCur();
  fxState = { amount: '1000', from: p === 'THB' ? 'LAK' : 'THB', to: p === 'THB' ? 'THB' : p };
  if (fxState.from === fxState.to) fxState.from = 'USD';
}
async function fxFetch(base, force) {
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || '{}'); } catch (e) {}
  const c = cache[base];
  if (!force && c && Date.now() - c.t < 6 * 3600 * 1000) return { base, rates: c.rates, updated: c.updated, src: 'cache' };
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/' + base);
    const j = await r.json();
    if (j.result !== 'success' || !j.rates) throw new Error('bad');
    cache[base] = { t: Date.now(), rates: j.rates, updated: j.time_last_update_utc };
    try { localStorage.setItem(FX_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
    return { base, rates: j.rates, updated: j.time_last_update_utc, src: 'live' };
  } catch (e) {
    if (c) return { base, rates: c.rates, updated: c.updated, src: 'stale' };
    return null;
  }
}
async function fxRefresh(force) {
  if (!fxState) return;
  const base = fxState.from;
  fxMeta = { base, rates: null, updated: null, src: 'loading' };
  updateFxView();
  const res = await fxFetch(base, force);
  if (fxState.from !== base) return;            // user changed currency meanwhile
  fxMeta = res || { base, rates: null, updated: null, src: 'none' };
  updateFxView();
}
function fxRateNow() {
  const { from, to } = fxState;
  if (from === to) return { rate: 1, src: 'same' };
  if (fxMeta.base === from && fxMeta.rates && fxMeta.rates[to]) return { rate: fxMeta.rates[to], src: fxMeta.src };
  const r = getRate(from, to);
  return r ? { rate: r, src: 'app' } : null;
}
function fxFmt(n, max) { return Number(n).toLocaleString(LOCALES[getLang()] || 'en-US', { maximumFractionDigits: max }); }
function fxRateFmt(r) { return fxFmt(r, r >= 100 ? 2 : r >= 1 ? 4 : 6); }
function fxWhen() {
  if (!fxMeta.updated) return '';
  const d = new Date(fxMeta.updated);
  return isNaN(d) ? fxMeta.updated : d.toLocaleString(LOCALES[getLang()] || 'en-US');
}
function updateFxView() {
  const $ = id => document.getElementById(id);
  if (!$('fx-result') || !fxState) return;
  const { from, to } = fxState;
  const rr = fxRateNow();
  const amt = parseFloat(fxState.amount) || 0;
  let src;
  const s = fxMeta.src;
  if (s === 'loading') src = '⏳ ' + L('กำลังดึงอัตราล่าสุด...', 'Fetching latest rates...');
  else if (rr && (rr.src === 'live' || rr.src === 'cache')) src = `✓ ${L('อัตราปัจจุบันจาก ExchangeRate-API', 'Current rates from ExchangeRate-API')} · ${L('อัปเดต', 'updated')} ${fxWhen()}`;
  else if (rr && rr.src === 'stale') src = `⚠ ${L('ออฟไลน์ ใช้อัตราที่โหลดไว้ล่าสุด', 'Offline — using last downloaded rates')} · ${fxWhen()}`;
  else if (rr && rr.src === 'app') src = `⚠ ${L('เชื่อมต่อแหล่งข้อมูลไม่ได้ ใช้อัตราที่ตั้งไว้ในแอป', "Couldn't reach the data source — using the rate saved in the app")}`;
  else if (rr && rr.src === 'same') src = '';
  else src = `⚠ ${L('ไม่พบอัตราของคู่นี้ ตรวจสอบอินเทอร์เน็ตแล้วกดรีเฟรช', 'No rate for this pair. Check your connection and refresh.')}`;
  if (rr) {
    $('fx-result').textContent = `${fxFmt(amt * rr.rate, 2)} ${to}`;
    $('fx-rate').textContent = `1 ${from} = ${fxRateFmt(rr.rate)} ${to}  ·  1 ${to} = ${fxRateFmt(1 / rr.rate)} ${from}`;
  } else { $('fx-result').textContent = '–'; $('fx-rate').textContent = ''; }
  $('fx-source').textContent = src;
  const ap = $('fx-apply'); if (ap) ap.disabled = !rr || rr.src === 'app' || rr.src === 'same' || s === 'loading';
}
function fxAmount(v) { fxState.amount = v; updateFxView(); }
function fxSet(k, v) {

}

function fxApply() {

  window._drItems = items;
  const el = document.createElement('div');
  el.id = 'drawer';
  el.innerHTML = `<div class="drawer-bk" onclick="closeDrawer()"></div>
    <aside class="drawer-panel" role="dialog" aria-label="menu">
      <div class="drawer-head"><div class="drawer-logo">M</div><div><div class="font-bold text-lg leading-tight">My Money Reset</div>
        <div class="text-xs" style="color:var(--txt)">${currentUser ? currentUser.email : L('ใช้งานในเครื่องนี้', 'This device')}</div></div></div>
      <nav class="drawer-list">${items.map((it, k) => `<button class="drawer-item" onclick="drawerRun(${k})">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${DR_ICON[it.i]}"/></svg><span>${it.l}</span></button>`).join('')}</nav>
    </aside>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('open'));
}
function closeDrawer() { const el = document.getElementById('drawer'); if (el) el.remove(); }
function drawerRun(k) { const it = (window._drItems || [])[k]; closeDrawer(); if (it) setTimeout(it.run, 50); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
function updateTopbar() {
  const el = document.getElementById('topbar-title'); if (!el) return;
  const m = { dashboard: ['ภาพรวม', 'Summary'], transactions: ['รายการ', 'Transactions'], add: ['เพิ่มรายการ', 'Add transaction'], budget: ['งบประมาณ', 'Budget'],
    goals: ['เป้าหมาย', 'Goals'], analytics: ['กราฟ & วิเคราะห์', 'Charts & analytics'], fx: ['อัตราแลกเปลี่ยน', 'Exchange rates'], insights: ['วิเคราะห์', 'Insights'],
    commitment: ['หยุดความเสี่ยงทางการเงิน', 'Stop financial risk'], reports: ['รายงาน', 'Reports'], settings: ['ตั้งค่า', 'Settings'], subscription: ['Premium', 'Subscription'], login: ['บัญชี', 'Account'] }[currentPage];
  el.textContent = m ? L(m[0], m[1]) : 'My Money Reset';
}

loadLocal();
try { migrateZeroBalance(); } catch (e) {}
try { refreshAccountNames(); } catch (e) {}
applyTheme(getTheme());
  document.documentElement.lang = getLang() === 'zh' ? 'zh-CN' : getLang();
initFirebase();
// ถ้ายังไม่ล็อกอิน → หน้าต้อนรับ, ถ้าล็อกอินแล้ว → dashboard
if (currentUser) navigate('dashboard');
else navigate('welcome');
if (hasPin()) showLock();
